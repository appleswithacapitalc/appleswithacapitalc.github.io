    <!-- Placed at the end of the document so the pages load faster -->
    <script src="../dist/bootstrap-5.3.8/js/bootstrap.bundle.min.js"></script>
    <script>
      // Remember any typo in puns.js so the page can say where it is
      window.addEventListener('error', function (ev) {
        if (ev.filename && ev.filename.indexOf('puns.js') !== -1) {
          window.PUNS_ERROR = ev.message + ' (line ' + ev.lineno + ')';
        }
      });
    </script>
    <script src="../files/puns/puns.js"></script>
    <script>
      // Builds the carousel and list from puns.js. You shouldn't need to edit this.
      (function () {
        var MONTHS = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];

        // Pun text may contain simple HTML; \n becomes a line break
        function html(t) { return String(t || '').replace(/\n/g, '<br>'); }
        function esc(t) {
          return String(t).replace(/[&<>"']/g, function (c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
          });
        }
        function niceDate(d) {
          var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(d || '').trim());
          return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : '';
        }
        function shuffle(a) {
          a = a.slice();
          for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
          return a;
        }
        function showError(msg) {
          document.getElementById('pun-slides').innerHTML =
            '<div class="carousel-item active"><div class="pun-slide"><p class="pun-text">Couldn\'t load the puns.</p>' +
            '<p class="pun-note">' + esc(msg) + '</p></div></div>';
          document.getElementById('pun-list-section').style.display = 'none';
        }

        if (typeof PUNS === 'undefined') {
          showError(window.PUNS_ERROR ? 'puns.js has a typo: ' + window.PUNS_ERROR
            : 'puns.js is missing or has a typo (often a missing comma or quote). Open the browser console (Cmd+Option+J in Chrome) to see the line.');
          return;
        }
        var settings = (typeof PUNS_SETTINGS !== 'undefined') ? PUNS_SETTINGS : {};
        var puns = PUNS.filter(function (p) { return p && String(p.pun || '').trim(); });

        // ---- Carousel: a random handful of puns, repeating ----
        // Picks carouselCount puns at random on each visit and cycles through them.
        // With reshuffleEachRound on, the order of those same puns changes every round.
        function slideInner(p) {
          return '<div class="pun-slide"><p class="pun-text">' + html(p.pun) + '</p>' +
                 (p.note ? '<p class="pun-note">' + html(p.note) + '</p>' : '') + '</div>';
        }
        var count = settings.carouselCount > 0 ? Math.min(settings.carouselCount, puns.length) : puns.length;
        var picks = shuffle(puns).slice(0, count);
        var order = picks;
        var carouselEl = document.getElementById('pun-carousel');
        var slides = order.map(function (p, i) {
          return '<div class="carousel-item' + (i === 0 ? ' active' : '') + '">' + slideInner(p) + '</div>';
        }).join('') || '<div class="carousel-item active"><div class="pun-slide"><p class="pun-text">No puns yet.</p></div></div>';
        document.getElementById('pun-slides').innerHTML = slides;

        // Dots only when there are few enough to be useful
        var showDots = order.length > 1 && order.length <= 12;
        document.getElementById('pun-indicators').innerHTML = showDots ? order.map(function (p, i) {
          return '<button type="button" data-bs-target="#pun-carousel" data-bs-slide-to="' + i + '"' +
                 (i === 0 ? ' class="active" aria-current="true"' : '') + ' aria-label="Pun ' + (i + 1) + '"></button>';
        }).join('') : '';

        if (order.length < 2) {
          carouselEl.querySelectorAll('.carousel-control-prev, .carousel-control-next').forEach(function (b) { b.style.display = 'none'; });
        } else {
          new bootstrap.Carousel(carouselEl, { interval: (settings.secondsPerSlide || 7) * 1000, ride: 'carousel' });
          // Reshuffle when a round finishes and it wraps back to the start
          if (settings.reshuffleEachRound !== false) carouselEl.addEventListener('slide.bs.carousel', function (e) {
            var last = order.length - 1;
            if (!(e.direction === 'left' && e.from === last && e.to === 0)) return;
            var current = order[last];
            var next = shuffle(picks);
            // don't show the same pun twice in a row across the reshuffle
            if (next[0] === current) { next.push(next.shift()); }
            order = next;
            var items = carouselEl.querySelectorAll('.carousel-item');
            order.forEach(function (p, i) { if (i !== last) items[i].innerHTML = slideInner(p); });
            // the slide that's showing now gets its new pun once it has moved off screen
            carouselEl.addEventListener('slid.bs.carousel', function once() {
              items[last].innerHTML = slideInner(order[last]);
              carouselEl.removeEventListener('slid.bs.carousel', once);
            });
          });
        }

        // ---- Full list: newest first, undated at the end ----
        if (settings.showFullList === false) {
          document.getElementById('pun-list-section').style.display = 'none';
        } else {
          var sorted = puns.slice().sort(function (a, b) {
            var da = String(a.date || ''), db = String(b.date || '');
            if (!da) return 1; if (!db) return -1;
            return da < db ? 1 : da > db ? -1 : 0;
          });
          document.getElementById('pun-list').innerHTML = sorted.map(function (p) {
            var d = niceDate(p.date);
            return '<li><div>' + html(p.pun) + '</div>' +
                   (p.note ? '<p class="pun-note">' + html(p.note) + '</p>' : '') +
                   (d ? '<p class="pun-date">' + d + '</p>' : '') + '</li>';
          }).join('') || '<li>No puns yet.</li>';
        }
      })();
    </script>
